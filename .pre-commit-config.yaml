# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
    -   id: ruff-check
        # Handle imports, see
        # https://github.com/astral-sh/ruff/issues/8232
        # https://github.com/astral-sh/ruff/issues/10882
        args: [ --fix, --extend-select, I ]
    -   id: ruff-format
        name: ruff format
-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
    -   id: mypy
        name: mypy
        # numpy and pytest are typed, so resolving them here buys real checking.
        # numba is deliberately omitted: it ships py.typed, but its annotations
        # don't model the @intrinsic calling convention (declared with numba
        # types, invoked with values), so resolving it only yields false
        # positives that must be silenced one by one.
        additional_dependencies: [numpy, pytest]
